name: SM-A536N BL read-only static inventory

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'BL_A536NKSUIGZI2_A536NKSUIGZI2_MQB114816381_REV00_user_low_ship_MULTI_CERT/**'
      - 'tools/a536n_bl_static_inventory.py'
      - 'tools/a536n_bl_extract_payloads.py'
      - 'tools/a536n_sboot_xref_scan.py'
      - 'tools/a536n_s5e8825_signature_check.py'
      - 'tools/a536n_usb_jpeg_flow_scan.py'
      - 'tools/a536n_usb_size_guard_check.py'
      - '.github/workflows/a536n-bl-static.yml'

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install LZ4 decoder
        run: |
          sudo apt-get update
          sudo apt-get install -y lz4

      - name: Run read-only inventory
        run: python3 tools/a536n_bl_static_inventory.py

      - name: Extract S-Boot and UP_PARAM for offline static inspection
        run: python3 tools/a536n_bl_extract_payloads.py

      - name: Scan AArch64 references to JPEG and secure-boot strings (read-only)
        run: python3 tools/a536n_sboot_xref_scan.py

      - name: Check S5E8825 resolver signatures without generating exploit offsets
        run: python3 tools/a536n_s5e8825_signature_check.py

      - name: Scan USB and JPEG diagnostic references (read-only)
        run: python3 tools/a536n_usb_jpeg_flow_scan.py

      - name: Validate USB packet-size guard instruction sequence (read-only)
        run: python3 tools/a536n_usb_size_guard_check.py

      - name: Upload reports and extracted payloads
        uses: actions/upload-artifact@v4
        with:
          name: A536N-BL-deep-analysis-payloads
          path: |
            A536N_BL_STATIC_REPORT.txt
            A536N_DEEP_STATIC_REPORT.txt
            A536N_SBOOT_XREF_REPORT.txt
            A536N_S5E8825_SIGNATURE_REPORT.txt
            A536N_USB_JPEG_FLOW_REPORT.txt
            A536N_USB_SIZE_GUARD_REPORT.txt
            analysis_payload/**
          if-no-files-found: error
          retention-days: 7

      - name: Commit reports to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add A536N_BL_STATIC_REPORT.txt A536N_DEEP_STATIC_REPORT.txt A536N_SBOOT_XREF_REPORT.txt A536N_S5E8825_SIGNATURE_REPORT.txt A536N_USB_JPEG_FLOW_REPORT.txt A536N_USB_SIZE_GUARD_REPORT.txt
          if ! git diff --cached --quiet; then
            git commit -m "Update SM-A536N BL static analysis reports"
            git push origin HEAD:main
          else
            echo "Reports unchanged; no commit needed."
          fi
